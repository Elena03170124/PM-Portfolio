<text x="729" y="670" font-family="Georgia, 'Noto Serif TC', serif" font-size="14.5" fill="#26161c"><tspan fill="#9c2f52">•</tspan> 強化後台操作理解，</text>
<text x="745" y="690" font-family="Georgia, 'Noto Serif TC', serif" font-size="14.5" fill="#26161c">降低誤操作風險</text>
