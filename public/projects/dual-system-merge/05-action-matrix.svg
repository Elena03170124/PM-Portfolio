<svg viewBox="0 0 1220 740" xmlns="http://www.w3.org/2000/svg">
<rect width="1220" height="740" fill="#f5f0ec"/>
<text x="610.0" y="50" text-anchor="middle" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="26" fill="#26161c">補教 x 家教雙系統合併規劃</text>
<text x="610.0" y="82" text-anchor="middle" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="17" fill="#9c2f52">三大項目 × 兩階段推進</text>
<text x="610.0" y="104" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.02em" fill="#a89890">STAR｜專案完整說明．三、行動</text>
<text x="164" y="138" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="16.5" fill="#9c2f52">先｜使用者端功能轉移</text>
<text x="164" y="162" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="12.5" fill="#85746b">確保 Live 用戶成功改以 Link+ 服務上課</text>
<text x="698" y="138" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="16.5" fill="#85746b">後｜營運端流程整合</text>
<text x="698" y="162" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="12.5" fill="#85746b">內勤單位由 MMS 改用 Link+ 管理資料</text>
<rect x="78" y="192.0" width="64" height="176" rx="12" fill="#9c2f52"/>
<text x="110.0" y="280.0" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">會員與班級資料</text>
<rect x="164" y="192" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="186" y="260.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 調整「一人一班」高分散班級歸屬結構</text>
<text x="186" y="292.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 依輔導／顧問所屬組別，對應分校與班級</text>
<rect x="698" y="192" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="720" y="260.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 梳理後台資料異動對前台顯示的連動關係</text>
<text x="720" y="292.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 建立同步規則：年級異動、會員停用／啟用</text>
<rect x="78" y="388.0" width="64" height="116" rx="12" fill="#9c2f52"/>
<text x="110.0" y="446.0" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">課程資料</text>
<rect x="164" y="388" width="512" height="116" rx="16" fill="#fdfaf9"/>
<text x="186" y="426.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 家教／補教課程資料仍分存 MMS、Link+</text>
<text x="186" y="458.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 前台整合，顯示 MMS 開立的家教課程</text>
<rect x="698" y="388" width="512" height="116" rx="16" fill="#fdfaf9"/>
<text x="720" y="426.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 以 MMS 作為唯一課程資料來源</text>
<text x="720" y="458.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 測試評估查詢效能與系統穩定性</text>
<rect x="78" y="524.0" width="64" height="176" rx="12" fill="#9c2f52"/>
<text x="110.0" y="612.0" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">前台功能與體驗</text>
<rect x="164" y="524" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="186" y="576.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 保留原登入入口與帳號身份切換機制</text>
<text x="186" y="608.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 延續學習獎章功能，對齊課程顯示排序</text>
<text x="186" y="640.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 設計白名單機制，支援家長跨系統追蹤</text>
<rect x="698" y="524" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="720" y="592.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 依角色（顧問／輔導／組長）設計可視範圍</text>
<text x="720" y="624.5" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 強化後台操作理解，降低誤操作風險</text>
<rect x="906" y="16" width="270" height="96" rx="12" fill="#f0e6e2"/>
<text x="920" y="34" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.04em" fill="#9c2f52">關聯服務說明</text>
<text x="920" y="53" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">Live<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：一對一家教上課系統，要整併到 Link+</tspan></text>
<text x="920" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">Link+<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：補習班上課系統，亦為整併的主系統</tspan></text>
<text x="920" y="87" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">MMS<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：公司內勤人員管理訂單或銷售資料的系統</tspan></text>
