<svg viewBox="0 0 1220 966" xmlns="http://www.w3.org/2000/svg">
<rect width="1220" height="966" fill="#f5f0ec"/>
<text x="610.0" y="50" text-anchor="middle" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="26" fill="#26161c">補教 x 家教雙系統合併規劃</text>
<text x="610.0" y="82" text-anchor="middle" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="17" fill="#9c2f52">三大項目 × 兩階段推進</text>
<text x="610.0" y="104" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.02em" fill="#a89890">STAR｜專案完整說明．三、行動</text>
<text x="164" y="138" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="16.5" fill="#9c2f52">先｜使用者端功能轉移</text>
<text x="164" y="162" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="12.5" fill="#85746b">確保 Live 用戶成功改以 Link+ 服務上課</text>
<text x="698" y="138" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="16.5" fill="#85746b">後｜營運端流程整合</text>
<text x="698" y="162" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="12.5" fill="#85746b">內勤單位由 MMS 改用 Link+ 管理資料</text>
<rect x="78" y="192.0" width="64" height="176.0" rx="12" fill="#9c2f52"/>
<text x="110.0" y="280.0" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">會員與班級資料</text>
<rect x="164" y="192" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="186" y="232.8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">收斂班級資料，降低整併後效能風險</text>
<text x="186" y="272.9" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 調整家教學生「一人一班」高分散班級歸屬結構</text>
<text x="186" y="302.9" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 依輔導／顧問所屬組別，對應分校與班級</text>
<text x="186" y="332.9" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 將家教學生5000班收斂成60班級數</text>
<rect x="698" y="192" width="512" height="176" rx="16" fill="#fdfaf9"/>
<text x="720" y="247.8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">協助營運單位改以補教系統管理會員資料</text>
<text x="720" y="287.9" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 建立營運後台資料與補教系統前台顯示間的聯動</text>
<text x="720" y="317.9" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 建立同步規則：年級異動、會員停用／啟用</text>
<rect x="78" y="388.0" width="64" height="199.0" rx="12" fill="#9c2f52"/>
<text x="110.0" y="487.5" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">課程資料</text>
<rect x="164" y="388" width="512" height="199" rx="16" fill="#fdfaf9"/>
<text x="186" y="425.3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">優先建立跨系統課程「可見性」，優先支援學生上課流程</text>
<text x="186" y="465.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 家教／補教課程資料仍分存 MMS、Link+</text>
<text x="186" y="495.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 新增家教課程讀取API</text>
<text x="186" y="525.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 家教學生登入補教系統時，觸發API讀取MMS課程資料</text>
<text x="186" y="555.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 讓學生即使改用補教系統，也能看到並完成原定課程</text>
<rect x="698" y="388" width="512" height="199" rx="16" fill="#fdfaf9"/>
<text x="720" y="425.3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">逐步統一課程資料取用與存放來源</text>
<text x="720" y="465.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 因使用情境差異甚遠，雙系統課程欄位難以相容合併</text>
<text x="720" y="495.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 由「合併」改為「統一取用來源」策略</text>
<text x="720" y="525.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 雙系統課程資料逐步統一由MMS管理</text>
<text x="720" y="555.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 達成「降低資料重複維運成本」的目標</text>
<rect x="78" y="607.0" width="64" height="319.0" rx="12" fill="#9c2f52"/>
<text x="110.0" y="766.5" text-anchor="middle" dominant-baseline="central" writing-mode="vertical-rl" text-orientation="upright" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.08em" fill="#faf6f3">前台功能與體驗</text>
<rect x="164" y="607" width="512" height="319" rx="16" fill="#fdfaf9"/>
<text x="186" y="644.3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">降低學生系統切換的操作落差，保留原系統關鍵服務與使用模式</text>
<text x="186" y="684.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 保留家教服務原始登入入口，輸入帳密後自動轉導至補教系</text>
<text x="202" y="714.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">統首頁</text>
<text x="186" y="744.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 延續家教系統「家庭共用帳號、登入後可切換子帳號」的特</text>
<text x="202" y="774.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">性，免去重新註冊新服務帳號的不便性</text>
<text x="186" y="804.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 處理跨系統引發的身份與權限判讀問題，以「功能入口／來</text>
<text x="202" y="834.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">源路徑」判斷是否進行家長學生身份轉換</text>
<text x="186" y="864.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 透過上述白名單處理機制，支援家長跨系統追蹤孩子學習狀</text>
<text x="202" y="894.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">況</text>
<rect x="698" y="607" width="512" height="319" rx="16" fill="#fdfaf9"/>
<text x="720" y="704.3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="0.02em" fill="#9c2f52">以前台功能支援營運單位，改以補教系統管理學生與班級</text>
<text x="720" y="744.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 以前置完成的新分班邏輯為基礎，依「分校 × 年級」進</text>
<text x="736" y="774.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">行班級重分配</text>
<text x="720" y="804.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c"><tspan fill="#c2748f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">–</tspan> 使各營運角色，可在其管理範圍內完整檢視學生班級與課程</text>
<text x="736" y="834.4" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="15" fill="#26161c">資訊</text>
<rect x="906" y="16" width="270" height="96" rx="12" fill="#f0e6e2"/>
<text x="920" y="34" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.04em" fill="#9c2f52">關聯服務說明</text>
<text x="920" y="53" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">Live<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：一對一家教上課系統，要整併到 Link+</tspan></text>
<text x="920" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">Link+<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：補習班上課系統，亦為整併的主系統</tspan></text>
<text x="920" y="87" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="10.5" fill="#c2748f">MMS<tspan font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="400" font-size="10.5" fill="#26161c" dx="5">：公司內勤人員管理訂單或銷售資料的系統</tspan></text>
</svg>